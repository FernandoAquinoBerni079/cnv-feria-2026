<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mario Bros — Edición Definitiva BTI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0f19;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
        }

        #game-container {
            position: relative;
            width: 850px;
            height: 480px;
            border: 4px solid #00f0ff;
            background: #5c94fc;
            overflow: hidden;
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
        }

        .hud {
            position: absolute;
            top: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-around;
            color: #ffffff;
            font-size: 1.15rem;
            font-weight: bold;
            text-shadow: 2px 2px #000;
            z-index: 10;
        }

        canvas {
            display: block;
        }

        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 8, 20, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #00f0ff;
            font-size: 2.3rem;
            margin-bottom: 10px;
            text-shadow: 0 0 15px #00f0ff;
        }

        p {
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 1rem;
            line-height: 1.5;
        }

        .btn {
            background-color: #e52521;
            color: white;
            border: 3px solid #fff;
            padding: 12px 30px;
            font-size: 1.15rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 0 #9b0000;
            border-radius: 4px;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #9b0000;
        }

        .hidden {
            display: none !important;
        }
    </style>

<style id="cibertips-return-style">
.cibertips-return { position: fixed; z-index: 2147483000; top: 12px; right: 12px; display: inline-flex; align-items: center; justify-content: center; gap: .25rem; max-width: calc(100vw - 24px); padding: .56rem .85rem; border: 1px solid #00f0ff; border-radius: 999px; color: #e6ffff; background: rgba(4,12,28,.93); box-shadow: 0 2px 14px rgba(0,0,0,.6); text-decoration: none; font: 700 12px/1.2 system-ui,sans-serif; letter-spacing: .01em; }
.cibertips-return:hover { background: #083148; }
.cibertips-return:focus-visible { outline: 3px solid yellow; outline-offset: 3px; }
@media (max-width:480px) { .cibertips-return { font-size: 11px; padding: .4rem .6rem; } }
</style>
</head>
<body>
<a class="cibertips-return" href="index.html#arcade" aria-label="Regresar a la selección de juegos de CiberTips">← Volver a CiberTips</a>

    <div id="game-container">
        <div class="hud">
            <div>MARIO <span id="score-val">000000</span></div>
            <div>🪙 <span id="coins-val">00</span></div>
            <div id="world-txt">WORLD 1-1</div>
            <div>TIME <span id="time-val">500</span></div>
        </div>

        <div id="start-screen" class="screen">
            <h1>🍄 SUPER MARIO BTI (DEFINITIVO) 🍄</h1>
            <p>Usa [ ◄ ► ] para caminar, [ ESPACIO ] para saltar.<br>Párate sobre el segundo tubo y presiona [ <b>ABAJO ↓</b> ] para entrar al subnivel. Coge la poción y vuelve a subir con [ <b>ARRIBA ↑</b> ].</p>
            <button class="btn" onclick="initAudioAndStart()">COMENZAR AVENTURA</button>
        </div>

        <div id="end-screen" class="screen hidden">
            <h1 id="end-title" style="color: #f43f5e;">¡GAME OVER!</h1>
            <button class="btn" onclick="resetGame()">VOLVER A INTENTAR</button>
        </div>

        <canvas id="canvas" width="850" height="480"></canvas>
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        let gameStarted = false;
        let score = 0;
        let coins = 0;
        let timeLeft = 500;
        let timeInterval = null;
        let cameraX = 0;
        let currentLevel = "surface"; 
        let gameState = "PLAYING"; 
        let hasPotion = false;
        let animationId = null;

        let audioCtx = null;

        function initAudioAndStart() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startGame();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'jump') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(hasPotion ? 220 : 150, now);
                osc.frequency.exponentialRampToValueAtTime(hasPotion ? 600 : 400, now + 0.15);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.12, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'powerup') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(800, now + 0.3);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                osc.start(now);
                osc.stop(now + 0.3);
            } else if (type === 'stomp') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(40, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'kick') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.linearRampToValueAtTime(80, now + 0.2);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        }

        let player = {
            x: 80,
            y: 330,
            width: 28,
            height: 38,
            vx: 0,
            vy: 0,
            speed: 4.2,
            jumpPower: -11.5,
            grounded: false
        };

        const gravity = 0.55;
        const worldLength = 6500;

        const surfacePlatforms = [
            { x: 0, y: 390, width: 700, height: 90, type: 'floor' },
            { x: 820, y: 390, width: 1100, height: 90, type: 'floor' },
            { x: 2050, y: 390, width: 1300, height: 90, type: 'floor' },
            { x: 3500, y: 390, width: 1200, height: 90, type: 'floor' },
            { x: 4850, y: 390, width: 1650, height: 90, type: 'floor' },

            { x: 250, y: 260, width: 35, height: 35, type: 'brick', hit: false },
            { x: 285, y: 260, width: 35, height: 35, type: 'box', hit: false, hasCoin: true },
            { x: 320, y: 260, width: 35, height: 35, type: 'brick', hit: false },
            { x: 950, y: 250, width: 35, height: 35, type: 'box', hit: false, hasCoin: true },
            { x: 1050, y: 250, width: 35, height: 35, type: 'box', hit: false, hasCoin: true },
            { x: 3800, y: 250, width: 35, height: 35, type: 'box', hit: false, hasCoin: true }
        ];

        const surfacePipes = [
            { x: 500, y: 320, width: 50, height: 70, id: 'normal', hasPlant: true },
            { x: 1500, y: 300, width: 50, height: 90, id: 'teleport', hasPlant: false },
            { x: 2700, y: 320, width: 50, height: 70, id: 'normal', hasPlant: true }
        ];

        let surfaceEnemies = [
            { x: 420, y: 360, width: 30, height: 30, vx: -1.2, minX: 350, maxX: 480, alive: true, type: 'goomba', state: 'walk' },
            { x: 1100, y: 355, width: 30, height: 35, vx: -1.1, minX: 900, maxX: 1300, alive: true, type: 'koopa', state: 'walk' },
            { x: 1800, y: 360, width: 30, height: 30, vx: -1.4, minX: 1600, maxX: 2000, alive: true, type: 'goomba', state: 'walk' },
            { x: 2900, y: 355, width: 30, height: 35, vx: -1.3, minX: 2500, maxX: 3200, alive: true, type: 'koopa', state: 'walk' },
            { x: 4500, y: 360, width: 30, height: 30, vx: -1.5, minX: 4200, maxX: 4700, alive: true, type: 'goomba', state: 'walk' }
        ];

        const undergroundPlatforms = [
            { x: 0, y: 390, width: 2500, height: 90, type: 'floor' },
            { x: 400, y: 200, width: 300, height: 35, type: 'cyan_brick' },
            { x: 900, y: 200, width: 300, height: 35, type: 'cyan_brick' },
            { x: 500, y: 150, width: 35, height: 35, type: 'box', hit: false, hasCoin: true },
            { x: 1000, y: 150, width: 35, height: 35, type: 'box', hit: false, hasCoin: true },
            { x: 2000, y: 310, width: 35, height: 80, type: 'cyan_brick' },
            { x: 2035, y: 270, width: 35, height: 120, type: 'cyan_brick' }
        ];

        const undergroundPipes = [
            { x: 2100, y: 300, width: 50, height: 90, id: 'exit_teleport' }
        ];

        let potion = { x: 450, y: 150, width: 25, height: 25, collected: false };

        let undergroundEnemies = [
            { x: 700, y: 355, width: 30, height: 35, vx: -1.2, minX: 500, maxX: 1200, alive: true, type: 'koopa', state: 'walk' }
        ];

        const flagpole = { x: 6150, y: 150, width: 8, height: 240 };
        const castle = { x: 6220, y: 230, width: 140, height: 160 };

        let floatingCoins = [];
        let keys = { left: false, right: false, down: false, up: false };

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = true;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = true;
            if (e.key === ' ' || e.key === 'ArrowUp') {
                if (player.grounded && gameState === "PLAYING") {
                    player.vy = hasPotion ? -14.5 : player.jumpPower;
                    player.grounded = false;
                    playSound('jump');
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowDown' || e.key === 's') keys.down = false;
            if (e.key === 'ArrowUp' || e.key === 'w') keys.up = false;
        });

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('end-screen').classList.add('hidden');
            resetGameValues();
            gameStarted = true;
            if (timeInterval) clearInterval(timeInterval);
            timeInterval = setInterval(() => {
                if (timeLeft > 0 && gameStarted) {
                    timeLeft--;
                    document.getElementById('time-val').innerText = timeLeft;
                }
            }, 1000);
            if (animationId) cancelAnimationFrame(animationId);
            loop();
        }

        function resetGameValues() {
            player.x = 80;
            player.y = 330;
            player.vx = 0;
            player.vy = 0;
            cameraX = 0;
            score = 0;
            coins = 0;
            timeLeft = 500;
            currentLevel = "surface";
            gameState = "PLAYING";
            hasPotion = false;
            potion.collected = false;
            document.getElementById('score-val').innerText = "000000";
            document.getElementById('coins-val').innerText = "00";
            document.getElementById('world-txt').innerText = "WORLD 1-1";

            surfaceEnemies.forEach(en => { en.alive = true; en.x = en.minX; en.state = 'walk'; en.vx = -1.2; });
            undergroundEnemies.forEach(en => { en.alive = true; en.x = en.minX; en.state = 'walk'; en.vx = -1.2; });
            surfacePlatforms.forEach(p => { if (p.type === 'box') p.hit = false; });
            undergroundPlatforms.forEach(p => { if (p.type === 'box') p.hit = false; });
            floatingCoins = [];
        }

        function resetGame() {
            document.getElementById('end-screen').classList.add('hidden');
            startGame();
        }

        function triggerGameOver(isVictory = false) {
            if (!gameStarted) return;
            gameStarted = false;
            if (timeInterval) clearInterval(timeInterval);
            if (animationId) cancelAnimationFrame(animationId);
            const title = document.getElementById('end-title');

            if (isVictory) {
                title.innerText = "¡NIVEL COMPLETADO!";
                title.style.color = "#22c55e";
            } else {
                title.innerText = "¡GAME OVER!";
                title.style.color = "#f43f5e";
            }
            document.getElementById('end-screen').classList.remove('hidden');
        }

        function update() {
            if (!gameStarted) return;

            if (gameState === "FLAG_SLIDE") {
                player.y += 3;
                if (player.y >= 350) {
                    gameState = "VICTORY";
                    triggerGameOver(true);
                }
                return;
            }

            let platforms = currentLevel === "surface" ? surfacePlatforms : undergroundPlatforms;
            let pipes = currentLevel === "surface" ? surfacePipes : undergroundPipes;
            let enemies = currentLevel === "surface" ? surfaceEnemies : undergroundEnemies;

            player.vx = 0;
            if (keys.left) player.vx = -player.speed;
            if (keys.right) player.vx = player.speed;

            player.x += player.vx;
            if (player.x < 0) player.x = 0;

            cameraX = player.x - 250;
            if (cameraX < 0) cameraX = 0;
            let maxCam = currentLevel === "surface" ? worldLength - canvas.width : 2500 - canvas.width;
            if (cameraX > maxCam) cameraX = maxCam;

            player.vy += gravity;
            player.y += player.vy;
            player.grounded = false;

            // Colisiones con plataformas
            platforms.forEach(p => {
                if (
                    player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height > p.y &&
                    player.y + player.height - player.vy <= p.y
                ) {
                    player.y = p.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                if (!p.hit && p.type === 'box') {
                    if (
                        player.x + player.width > p.x + 4 &&
                        player.x < p.x + p.width - 4 &&
                        player.y <= p.y + p.height &&
                        player.y - player.vy >= p.y + p.height
                    ) {
                        player.vy = 2;
                        p.hit = true;
                        playSound('coin');

                        if (p.hasCoin) {
                            coins++;
                            score += 200;
                            document.getElementById('coins-val').innerText = coins < 10 ? "0" + coins : coins;
                            document.getElementById('score-val').innerText = String(score).padStart(6, '0');
                            floatingCoins.push({ x: p.x + 5, y: p.y - 20, vy: -3 });
                        }
                    }
                }
            });

            // Colisiones limpias con Tuberías (Sin trabarse al caminar o subir encima)
            pipes.forEach(pi => {
                // Pararse encima del tubo
                if (
                    player.x < pi.x + pi.width &&
                    player.x + player.width > pi.x &&
                    player.y + player.height > pi.y &&
                    player.y + player.height - player.vy <= pi.y
                ) {
                    player.y = pi.y - player.height;
                    player.vy = 0;
                    player.grounded = true;
                }

                // Teletransporte controlado solo al presionar las flechas estando exactamente arriba
                if (currentLevel === "surface" && pi.id === 'teleport' && keys.down &&
                    player.x + player.width > pi.x + 5 && player.x < pi.x + pi.width - 5 && 
                    Math.abs(pi.y - (player.y + player.height)) < 5) {
                    currentLevel = "underground";
                    player.x = 80;
                    player.y = 330;
                    document.getElementById('world-txt').innerText = "WORLD 1-2 (SUB)";
                } else if (currentLevel === "underground" && pi.id === 'exit_teleport' && keys.up &&
                    player.x + player.width > pi.x + 5 && player.x < pi.x + pi.width - 5 && 
                    Math.abs(pi.y - (player.y + player.height)) < 5) {
                    currentLevel = "surface";
                    player.x = 1550;
                    player.y = 330;
                    document.getElementById('world-txt').innerText = "WORLD 1-1";
                }
            });

            // Colisión con Plantas Piraña en superficie
            if (currentLevel === "surface") {
                surfacePipes.forEach((pi, idx) => {
                    if (pi.hasPlant) {
                        let pOffsetY = Math.sin(Date.now() / 300 + idx) * 12;
                        let plantY = pi.y - 15 + pOffsetY;
                        if (player.x < pi.x + 40 && player.x + player.width > pi.x + 10 &&
                            player.y < plantY + 25 && player.y + player.height > plantY) {
                            triggerGameOver(false);
                            return;
                        }
                    }
                });
            }

            // Recoger Poción
            if (currentLevel === "underground" && !potion.collected) {
                if (player.x < potion.x + potion.width && player.x + player.width > potion.x &&
                    player.y < potion.y + potion.height && player.y + player.height > potion.y) {
                    potion.collected = true;
                    hasPotion = true;
                    playSound('powerup');
                }
            }

            // Enemigos
            enemies.forEach(en => {
                if (!en.alive) return;

                if (en.state === 'walk' || en.state === 'shell_slide') {
                    en.x += en.vx;
                    if (en.x <= en.minX || en.x >= en.maxX) en.vx *= -1;
                }

                if (
                    player.x < en.x + en.width &&
                    player.x + player.width > en.x &&
                    player.y < en.y + en.height &&
                    player.y + player.height > en.y
                ) {
                    if (player.vy > 0 && player.y + player.height - player.vy <= en.y + 14) {
                        if (en.type === 'goomba') {
                            en.alive = false;
                            playSound('stomp');
                        } else if (en.type === 'koopa') {
                            if (en.state === 'walk') {
                                en.state = 'shell_still';
                                en.vx = 0;
                                playSound('stomp');
                            } else if (en.state === 'shell_still') {
                                en.state = 'shell_slide';
                                en.vx = 6.5;
                                playSound('kick');
                            } else {
                                en.state = 'shell_still';
                                en.vx = 0;
                                playSound('stomp');
                            }
                        }
                        score += 100;
                        document.getElementById('score-val').innerText = String(score).padStart(6, '0');
                        player.vy = -8.5;
                    } else {
                        if (en.type === 'koopa' && en.state === 'shell_still') {
                            en.state = 'shell_slide';
                            en.vx = 6.5;
                            playSound('kick');
                        } else if (en.state !== 'shell_still') {
                            triggerGameOver(false);
                            return;
                        }
                    }
                }
            });

            floatingCoins.forEach(c => { c.y += c.vy; });

            if (currentLevel === "surface" && player.x >= flagpole.x - 10 && player.x <= flagpole.x + 20) {
                gameState = "FLAG_SLIDE";
                player.x = flagpole.x - 4;
                player.vy = 0;
            }

            if (player.y > canvas.height) {
                triggerGameOver(false);
            }
        }

        function draw() {
            ctx.fillStyle = currentLevel === "surface" ? "#5c94fc" : "#020817";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            ctx.translate(-cameraX, 0);

            if (currentLevel === "surface") {
                ctx.fillStyle = "#ffffff";
                for (let i = 150; i < worldLength; i += 600) {
                    ctx.beginPath();
                    ctx.arc(i, 90, 26, 0, Math.PI * 2);
                    ctx.arc(i + 25, 80, 32, 0, Math.PI * 2);
                    ctx.arc(i + 50, 90, 26, 0, Math.PI * 2);
                    ctx.fill();
                }

                surfacePlatforms.forEach(p => {
                    if (p.type === 'floor') {
                        ctx.fillStyle = "#c84c0c";
                        ctx.fillRect(p.x, p.y, p.width, p.height);
                        ctx.fillStyle = "#fcbc3c";
                        ctx.fillRect(p.x, p.y, p.width, 16);
                    } else if (p.type === 'brick') {
                        ctx.fillStyle = p.hit ? "#85411c" : "#b85d19";
                        ctx.fillRect(p.x, p.y, p.width, p.height);
                        ctx.strokeStyle = "#000";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(p.x, p.y, p.width, p.height);
                    } else if (p.type === 'box') {
                        if (!p.hit) {
                            ctx.fillStyle = "#f8b800";
                            ctx.fillRect(p.x, p.y, p.width, p.height);
                            ctx.strokeStyle = "#000";
                            ctx.lineWidth = 2;
                            ctx.strokeRect(p.x, p.y, p.width, p.height);
                            ctx.fillStyle = "#000";
                            ctx.font = "bold 20px monospace";
                            ctx.fillText("?", p.x + 10, p.y + 26);
                        } else {
                            ctx.fillStyle = "#85411c";
                            ctx.fillRect(p.x, p.y, p.width, p.height);
                            ctx.strokeStyle = "#000";
                            ctx.lineWidth = 2;
                            ctx.strokeRect(p.x, p.y, p.width, p.height);
                        }
                    }
                });

                surfacePipes.forEach((pi, idx) => {
                    ctx.fillStyle = "#00a800";
                    ctx.fillRect(pi.x, pi.y, pi.width, pi.height);
                    ctx.fillStyle = "#00d800";
                    ctx.fillRect(pi.x - 4, pi.y, pi.width + 8, 20);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pi.x - 4, pi.y, pi.width + 8, 20);
                    ctx.strokeRect(pi.x, pi.y, pi.width, pi.height);

                    if (pi.hasPlant) {
                        let pOffsetY = Math.sin(Date.now() / 300 + idx) * 12;
                        ctx.fillStyle = "#e52521";
                        ctx.fillRect(pi.x + 10, pi.y - 15 + pOffsetY, 30, 25);
                        ctx.fillStyle = "#ffffff";
                        ctx.fillRect(pi.x + 14, pi.y - 8 + pOffsetY, 6, 6);
                        ctx.fillRect(pi.x + 28, pi.y - 8 + pOffsetY, 6, 6);
                    }
                });

                ctx.fillStyle = "#22c55e";
                ctx.fillRect(flagpole.x, flagpole.y, flagpole.width, flagpole.height);
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.moveTo(flagpole.x, flagpole.y + 10);
                ctx.lineTo(flagpole.x - 35, flagpole.y + 25);
                ctx.lineTo(flagpole.x, flagpole.y + 40);
                ctx.fill();

                ctx.fillStyle = "#94a3b8";
                ctx.fillRect(castle.x, castle.y, castle.width, castle.height);
                ctx.fillStyle = "#000000";
                ctx.fillRect(castle.x + 45, castle.y + 90, 50, 70);
                ctx.fillStyle = "#64748b";
                ctx.fillRect(castle.x - 15, castle.y - 30, 35, castle.height + 30);
                ctx.fillRect(castle.x + castle.width - 20, castle.y - 30, 35, castle.height + 30);

                surfaceEnemies.forEach(en => {
                    if (en.alive) {
                        if (en.type === 'goomba') {
                            ctx.fillStyle = "#a04000";
                            ctx.fillRect(en.x, en.y + 8, en.width, en.height - 8);
                            ctx.fillStyle = "#fcd8a8";
                            ctx.fillRect(en.x + 3, en.y, en.width - 6, 12);
                            ctx.fillStyle = "#000";
                            ctx.fillRect(en.x + 5, en.y + 3, 4, 4);
                            ctx.fillRect(en.x + 21, en.y + 3, 4, 4);
                        } else if (en.type === 'koopa') {
                            if (en.state === 'walk') {
                                ctx.fillStyle = "#22c55e";
                                ctx.fillRect(en.x, en.y + 5, en.width, en.height - 5);
                                ctx.fillStyle = "#fcd8a8";
                                ctx.fillRect(en.x - 6, en.y + 12, 12, 12);
                            } else {
                                ctx.fillStyle = "#22c55e";
                                ctx.fillRect(en.x + 2, en.y + 10, en.width - 4, en.height - 10);
                            }
                        }
                    }
                });

            } else {
                undergroundPlatforms.forEach(p => {
                    if (p.type === 'floor') {
                        ctx.fillStyle = "#1e293b";
                        ctx.fillRect(p.x, p.y, p.width, p.height);
                        ctx.fillStyle = "#0f172a";
                        ctx.fillRect(p.x, p.y, p.width, 16);
                    } else if (p.type === 'cyan_brick') {
                        ctx.fillStyle = "#0284c7";
                        ctx.fillRect(p.x, p.y, p.width, p.height);
                        ctx.strokeStyle = "#0f172a";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(p.x, p.y, p.width, p.height);
                    } else if (p.type === 'box') {
                        if (!p.hit) {
                            ctx.fillStyle = "#f8b800";
                            ctx.fillRect(p.x, p.y, p.width, p.height);
                            ctx.strokeStyle = "#000";
                            ctx.lineWidth = 2;
                            ctx.strokeRect(p.x, p.y, p.width, p.height);
                            ctx.fillStyle = "#000";
                            ctx.font = "bold 20px monospace";
                            ctx.fillText("?", p.x + 10, p.y + 26);
                        } else {
                            ctx.fillStyle = "#0f172a";
                            ctx.fillRect(p.x, p.y, p.width, p.height);
                            ctx.strokeStyle = "#000";
                            ctx.lineWidth = 2;
                            ctx.strokeRect(p.x, p.y, p.width, p.height);
                        }
                    }
                });

                undergroundPipes.forEach(pi => {
                    ctx.fillStyle = "#00a800";
                    ctx.fillRect(pi.x, pi.y, pi.width, pi.height);
                    ctx.fillStyle = "#00d800";
                    ctx.fillRect(pi.x - 4, pi.y, pi.width + 8, 20);
                    ctx.strokeStyle = "#000";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(pi.x - 4, pi.y, pi.width + 8, 20);
                    ctx.strokeRect(pi.x, pi.y, pi.width, pi.height);
                });

                if (!potion.collected) {
                    ctx.fillStyle = "#ec4899";
                    ctx.beginPath();
                    ctx.arc(potion.x + 12, potion.y + 15, 10, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(potion.x + 9, potion.y + 5, 6, 6);
                }

                undergroundEnemies.forEach(en => {
                    if (en.alive) {
                        ctx.fillStyle = "#22c55e";
                        ctx.fillRect(en.x, en.y + 5, en.width, en.height - 5);
                    }
                });
            }

            floatingCoins.forEach(c => {
                ctx.fillStyle = "#f8b800";
                ctx.font = "20px monospace";
                ctx.fillText("🪙 +1", c.x, c.y);
            });

            ctx.fillStyle = hasPotion ? "#eab308" : "#e52521";
            ctx.fillRect(player.x, player.y + 12, player.width, player.height - 12);
            ctx.fillStyle = "#0000f8";
            ctx.fillRect(player.x + 4, player.y + 22, player.width - 8, 16);
            ctx.fillStyle = "#fcd8a8";
            ctx.fillRect(player.x + 5, player.y + 4, 18, 11);
            ctx.fillStyle = hasPotion ? "#eab308" : "#e52521";
            ctx.fillRect(player.x + 3, player.y, 22, 5);

            ctx.restore();
        }

        function loop() {
            update();
            draw();
            if (gameStarted) {
                animationId = requestAnimationFrame(loop);
            }
        }
    </script>
</body>
</html>
